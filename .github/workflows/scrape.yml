# Runs the scraper every 30 minutes from 07:00 to 21:00 Japan time and commits any changes,
# which updates the website.
#
# In season (months set in resorts.yaml):
#   - every run: latest lift/run status -> docs/data/live.json (committed only if a status changed)
#   - first run at or after 09:30: the day's permanent record, weather and season summary
# Off season: scrapes nothing, but once a month commits a small check-in to
# docs/data/lifts.json. That commit keeps the repository "active"; GitHub switches off
# scheduled workflows in public repositories with no activity for 60 days.
#
# To run it by hand: GitHub -> Actions -> "Lift scrape" -> "Run workflow".

name: Lift scrape

on:
  schedule:
    # GitHub schedules are in UTC; Japan is UTC+9. GitHub can start runs late at busy times.
    - cron: "0,30 22,23 * * *"   # 07:00-08:30 Japan time
    - cron: "0,30 0-11 * * *"    # 09:00-20:30 Japan time
    - cron: "0 12 * * *"         # 21:00 Japan time
  workflow_dispatch:
    inputs:
      daily:
        description: "Also rewrite today's daily record (snow, weather, history) now"
        type: boolean
        default: false
      force:
        description: "Scrape even outside the season months"
        type: boolean
        default: false

permissions:
  contents: write  # needed to commit the data

concurrency:
  group: scrape    # never run two at once
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: "Install browser (only if a resort uses fetch: browser)"
        run: |
          if grep -q "fetch: *browser" resorts.yaml; then
            python -m playwright install --with-deps chromium
          else
            echo "No resort needs a browser; skipping."
          fi

      - name: Scrape
        run: python -m scraper.run ${{ inputs.daily && '--daily' || '' }} ${{ inputs.force && '--force' || '' }}

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Lift data $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST"
          # Someone may have pushed code while this ran; put the data commit on top of it.
          git pull --rebase
          git push
