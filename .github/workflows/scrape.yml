# Starts the scraper every 45 minutes, around the clock, and commits any changes, which
# updates the website. Each run only scrapes the resorts whose LOCAL time is 09:00-21:00
# (Japan, Europe and North America take turns; see `schedule` in resorts.yaml).
#
# In season (months per group in resorts.yaml), for each resort inside its hours:
#   - every run: latest lift/run status -> its group's live file, e.g. docs/data/live-europe.json
#     (committed only if a status changed)
#   - first run at or after 09:30 local: the day's permanent record, weather and season summary
# Off season everywhere: scrapes nothing, but once a month commits a small check-in to
# docs/data/lifts.json. That commit keeps the repository "active"; GitHub switches off
# scheduled workflows in public repositories with no activity for 60 days.
#
# Alerts: if a resort's page fails for 6+ hours, or the daily record suddenly has far fewer
# lifts/runs than usual, a GitHub issue is opened (GitHub emails you); it closes by itself
# when the resort works again. See scraper/alerts.py.
#
# To run it by hand: GitHub -> Actions -> "Lift scrape" -> "Run workflow".

name: Lift scrape

on:
  schedule:
    # Every 45 minutes all day (32 runs, UTC). 8 minutes past because GitHub delays or drops
    # scheduled runs at busy times (:00, :30). A run with no resort inside its local hours
    # finishes in seconds without committing.
    # 00:08 00:53 01:38 02:23 03:08 03:53 04:38 05:23 06:08 ... 22:38 23:23
    - cron: "8,53 0,3,6,9,12,15,18,21 * * *"
    - cron: "38 1,4,7,10,13,16,19,22 * * *"
    - cron: "23 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:
    inputs:
      daily:
        description: "Also rewrite today's daily record (snow, weather, history) now"
        type: boolean
        default: false
      force:
        description: "Scrape every resort now, even off-season or outside its hours"
        type: boolean
        default: false

permissions:
  contents: write  # needed to commit the data
  issues: write    # needed to open/close alert issues

concurrency:
  group: scrape    # never run two at once
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: "Install browser (only if a resort due now uses fetch: browser)"
        run: |
          if [ "$(python -m scraper.run --needs-browser ${{ inputs.force && '--force' || '' }})" = yes ]; then
            python -m playwright install --with-deps chromium
          else
            echo "No resort due now needs a browser; skipping."
          fi

      - name: Scrape
        run: python -m scraper.run --alerts "$RUNNER_TEMP/alerts.json" ${{ inputs.daily && '--daily' || '' }} ${{ inputs.force && '--force' || '' }}

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Lift data $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Someone may have pushed code while this ran; put the data commit on top of it.
          git pull --rebase
          git push

      - name: Open or close alert issues
        if: always()               # also when every resort failed
        continue-on-error: true    # an alert problem must never fail the scrape
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: python -m scraper.alerts "$RUNNER_TEMP/alerts.json"
