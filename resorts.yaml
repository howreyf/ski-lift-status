# List of resorts the scraper visits.
#
#   id        short, permanent key used in docs/data/lifts.json (never change it once data exists)
#   name      display name on the website
#   region    used to group resorts on the website
#   url       the lift status page
#   parser    file in scraper/parsers/ that reads the page (without .py)
#   data_url  (optional) where the data is actually downloaded from, when the page loads it
#             from a separate feed; `url` is still the page linked from the website
#   fetch     "html" (plain download, default) or "browser" (Playwright, for JavaScript-built pages)
#   options   extra settings passed to the parser (optional)
#   enabled   set to false to skip a resort (e.g. parser not written yet, or site broken)
#   location  approximate centre of the ski area (for the Open-Meteo temperatures)
#   elevation base and summit height in metres (lowest and highest lift-served points, from
#             the resort's published figures); daily low/high temperatures are for these heights

# Months when lift data is collected (inclusive). Outside them the daily run only saves a
# small monthly check-in, which keeps GitHub from switching the schedule off.
season:
  start_month: 11   # November
  end_month: 4      # April

resorts:
  # --- Hokkaido ---
  - id: niseko-hirafu
    name: Niseko Grand Hirafu
    region: Hokkaido
    location: { lat: 42.862, lon: 140.686 }
    elevation: { base: 260, summit: 1200 }   # metres
    url: https://www.grand-hirafu.jp/snow/status/
    parser: niseko
    enabled: true

  - id: kiroro
    name: Kiroro
    region: Hokkaido
    location: { lat: 43.076, lon: 140.986 }
    elevation: { base: 570, summit: 1180 }   # metres
    url: https://www.kiroro.co.jp/dashboard/
    parser: kiroro
    enabled: true

  - id: rusutsu
    name: Rusutsu
    region: Hokkaido
    location: { lat: 42.75, lon: 140.896 }
    elevation: { base: 400, summit: 994 }   # metres
    url: https://rusutsu.com/en/lift-and-trail-status/
    data_url: https://rusutsu.com/assets/partial/ajax/trail-and-lift/get-front.php
    parser: rusutsu
    enabled: true

  - id: furano
    name: Furano
    region: Hokkaido
    location: { lat: 43.327, lon: 142.35 }
    elevation: { base: 235, summit: 1074 }   # metres
    url: https://furapuri.com/ski/
    data_url: https://furapuri.com/ski/data.json
    parser: furano
    enabled: true

  - id: tomamu
    name: Tomamu
    region: Hokkaido
    location: { lat: 43.063, lon: 142.625 }
    elevation: { base: 586, summit: 1171 }   # metres
    url: https://www.snowtomamu.jp/winter/en/ski/ski-slope/condition/
    parser: tomamu
    enabled: true

  - id: sapporo-kokusai
    name: Sapporo Kokusai
    region: Hokkaido
    location: { lat: 43.081, lon: 141.096 }
    elevation: { base: 630, summit: 1100 }   # metres
    url: https://www.sapporo-kokusai.jp/en/slopes/
    parser: sapporo_kokusai
    enabled: true

  - id: sapporo-teine
    name: Sapporo Teine
    region: Hokkaido
    location: { lat: 43.077, lon: 141.195 }
    elevation: { base: 340, summit: 1023 }   # metres
    url: https://sapporo-teine.com/snow/gelande-report-en
    parser: sapporo_teine
    enabled: true

  # --- Nagano ---
  - id: shiga-kogen
    name: Shiga Kogen
    region: Nagano
    location: { lat: 36.705, lon: 138.508 }
    elevation: { base: 1340, summit: 2307 }   # metres
    url: https://www.shigakogen.gr.jp/english/lift_information/
    parser: shiga_kogen
    enabled: true

  - id: hakuba-goryu
    name: Hakuba Goryu
    region: Nagano
    location: { lat: 36.659, lon: 137.822 }
    elevation: { base: 750, summit: 1676 }   # metres
    url: http://hakubavalley.com/en/weather_en/
    parser: hakuba_valley
    options: { area: goryu }
    enabled: true

  - id: hakuba-47
    name: Hakuba 47
    region: Nagano
    location: { lat: 36.666, lon: 137.814 }
    elevation: { base: 820, summit: 1614 }   # metres
    url: http://hakubavalley.com/en/weather_en/
