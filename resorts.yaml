# List of resorts the scraper visits.
#
#   id        short, permanent key used in docs/data/lifts.json (never change it once data exists)
#   name      display name on the website
#   region    shown under the name; resorts are grouped by country, then region, on the website
#   country   (optional) defaults to the group's country
#   timezone  (optional) the resort's time zone (IANA name); defaults to the group's.
#             Scraping hours and the daily record use the resort's local time.
#   group     which data files the resort's records go in (see groups below); default japan
#   url       the lift status page
#   parser    file in scraper/parsers/ that reads the page (without .py)
#   runs_url  (optional) a separate page with run status (the parser's parse_runs reads it)
#   snow_url  (optional) a separate page with the snow report (the parser's parse_snow reads it)
#   data_url  (optional) where the data is actually downloaded from, when the page loads it
#             from a separate feed; `url` is still the page linked from the website
#   fetch     "html" (plain download, default) or "browser" (Playwright, for JavaScript-built pages)
#   options   extra settings passed to the parser (optional)
#   enabled   set to false to skip a resort (e.g. parser not written yet, or site broken)
#   location  approximate centre of the ski area (for the Open-Meteo temperatures)
#   elevation base and summit height in metres (lowest and highest lift-served points, from
#             the resort's published figures); daily low/high temperatures are for these heights
#   website   the resort's official website (linked under the name on its page)
#   night_skiing  (optional) per season: from / to (dates), to_note (if the end isn't a date),
#             hours, note, lifts (names as shown on the site, English where available).
#             Shown as a moon symbol beside the resort and those lifts.
#   map       trail map shown at the bottom of its page: type image (shown on the page),
#             pdf or page (linked); optional note shown under it

# Months when lift data is collected (inclusive). Outside them the daily run only saves a
# small monthly check-in, which keeps GitHub from switching the schedule off.
# When to scrape, in each resort's LOCAL time. The GitHub workflow starts every 45 minutes
# around the clock; each run only scrapes the resorts whose local time is inside `hours`
# (until `until`, because GitHub often starts runs late).
schedule:
  hours: ["09:00", "21:00"]
  until: "22:00"
  daily_time: "09:30"   # the first run at or after this (local) time writes the day's permanent record

# Resort groups. Each group has its own data files, so no file gets too big and a run that
# only changes Europe doesn't rewrite Japan's file:
#   live_file     latest lift/run status (docs/data/...)
#   season_file   every day of one season; {season} becomes e.g. 2026-27
#   season        months when lift data is collected (inclusive), checked in local time.
#                 Outside them nothing is scraped for that group.
#   country / timezone   defaults for the group's resorts
groups:
  japan:
    name: Japan
    country: Japan
    timezone: Asia/Tokyo
    live_file: live.json
    season_file: "seasons/{season}.json"
    season: { start_month: 11, end_month: 5 }   # Niseko and Sapporo Kokusai close on 5 May
  europe:
    name: Europe
    timezone: Europe/Rome
    live_file: live-europe.json
    season_file: "seasons/europe/{season}.json"
    season: { start_month: 10, end_month: 5 }   # glaciers (Zugspitze, Kitzsteinhorn) open in October
  north-america:
    name: North America
    timezone: America/Denver
    live_file: live-north-america.json
    season_file: "seasons/north-america/{season}.json"
    season: { start_month: 11, end_month: 5 }   # Whistler Blackcomb runs into May

