  # --- Niigata ---
  - id: gala-yuzawa
    name: GALA Yuzawa
    region: Niigata
    location: { lat: 36.946, lon: 138.795 }
    elevation: { base: 358, summit: 1181 }   # metres
    url: https://gala.co.jp/winter/gelande/?wovn=en
